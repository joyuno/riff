<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리뷰 인사이트 — 무엇부터 고칠지 한눈에</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>리뷰 인사이트</h1>
  <p class="subtitle">리뷰를 붙여넣으면 문제 유형별로 분류하고, 어떤 상품부터 고쳐야 할지 우선순위로 보여줍니다.</p>
</header>

<main>
  <section class="panel" aria-labelledby="input-heading">
    <h2 id="input-heading">1. 리뷰 붙여넣기</h2>
    <form id="review-form">
      <label for="product-name">상품명</label>
      <input type="text" id="product-name" placeholder="예: OO 원피스" required>

      <label for="review-text">리뷰 원문 (여러 건은 빈 줄로 구분해서 붙여넣으세요)</label>
      <textarea id="review-text" rows="8" placeholder="별점 ★★☆☆☆ / 이OO / 2026.07.20&#10;사이즈가 생각보다 작아요.&#10;&#10;별점 ★☆☆☆☆ / 김OO / 2026.07.18&#10;박스가 찌그러진 채로 왔고 제품도 파손됐어요. 환불 요청합니다." required></textarea>

      <button type="submit">분석하기</button>
    </form>
    <p id="import-status" class="status" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="summary-heading">
    <h2 id="summary-heading">2. 전체 문제 유형별 건수</h2>
    <ul id="category-summary" class="category-summary"></ul>
    <p id="empty-summary" class="empty-note">아직 저장된 리뷰가 없습니다. 위에서 리뷰를 붙여넣어 시작하세요.</p>
  </section>

  <section class="panel" aria-labelledby="priority-heading">
    <h2 id="priority-heading">3. 무엇부터 고칠지 — 상품 우선순위</h2>
    <table id="priority-table" class="priority-table">
      <thead>
        <tr>
          <th>순위</th>
          <th>상품명</th>
          <th>심각 리뷰</th>
          <th>전체 문제 건수</th>
          <th>주요 유형</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel severe-panel" aria-labelledby="severe-heading">
    <h2 id="severe-heading">4. 심각 리뷰 (1점 또는 파손·환불·안전 관련) — 먼저 확인하세요</h2>
    <ul id="severe-list" class="severe-list"></ul>
    <p id="empty-severe" class="empty-note">심각 리뷰가 없습니다.</p>
  </section>

  <section class="panel" aria-labelledby="raw-heading">
    <h2 id="raw-heading">5. 저장된 리뷰 원문 다시 보기</h2>
    <label for="product-filter">상품별로 보기</label>
    <select id="product-filter"></select>
    <ul id="raw-list" class="raw-list"></ul>
  </section>

  <button id="reset-all" class="danger" type="button">전체 초기화</button>
</main>

<script src="js/app.js"></script>
</body>
</html>
