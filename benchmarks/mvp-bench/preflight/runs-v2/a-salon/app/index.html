<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미용실 예약 관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>미용실 예약 관리</h1>
    <p id="revenue-summary"></p>
  </header>

  <section class="date-nav">
    <input type="date" id="date-input">
    <button type="button" id="today-btn">오늘</button>
    <button type="button" id="tomorrow-btn">내일</button>
  </section>

  <section class="card">
    <h2>새 예약 추가</h2>
    <form id="add-form">
      <div class="form-grid">
        <label>고객명
          <input type="text" name="customerName" required>
        </label>
        <label>전화번호
          <input type="tel" name="phone" placeholder="010-0000-0000">
        </label>
        <label>날짜
          <input type="date" name="date" required>
        </label>
        <label>시작 시각
          <input type="time" name="startTime" required>
        </label>
        <label>시술명
          <input type="text" name="service" placeholder="예: 커트, 펌" required>
        </label>
        <label>소요 시간(분)
          <input type="number" name="durationMin" min="5" step="5" value="60" required>
        </label>
        <label>금액(원, 선택)
          <input type="number" name="price" min="0" step="1000">
        </label>
        <label>메모(선택)
          <input type="text" name="memo">
        </label>
      </div>
      <p id="form-error" role="alert"></p>
      <button type="submit">예약 추가</button>
    </form>
  </section>

  <section>
    <h2>예약 목록</h2>
    <div id="reservation-list"></div>
  </section>

  <script src="js/booking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
