<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적·고객 진행 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>견적·고객 진행 관리</h1>
  <div class="summary">
    <span class="summary-label">승인 견적 합계</span>
    <span id="approvedSum" class="summary-amount">0원</span>
  </div>
</header>

<main>
  <section class="panel" aria-label="새 견적">
    <h2>새 견적 만들기</h2>
    <form id="quoteForm" novalidate>
      <div class="field">
        <label for="client">고객명</label>
        <input type="text" id="client" required>
      </div>
      <div class="field">
        <label for="itemDesc">항목 설명</label>
        <input type="text" id="itemDesc" placeholder="예: 로고 디자인">
      </div>
      <div class="field field-amount">
        <label for="amount">금액</label>
        <input type="number" id="amount" min="1" step="1" required>
        <select id="vatMode">
          <option value="exclusive">부가세 별도</option>
          <option value="inclusive">부가세 포함</option>
        </select>
      </div>
      <div class="field">
        <label for="scope">수정 범위</label>
        <input type="text" id="scope" placeholder="예: 시안 2회, 수정 3회">
      </div>
      <div id="formError" class="form-error" role="alert" hidden></div>
      <button type="submit">견적 저장</button>
    </form>
  </section>

  <section class="panel" aria-label="견적 목록">
    <h2>견적 목록</h2>
    <div class="controls">
      <input type="search" id="searchClient" placeholder="고객명으로 검색">
      <select id="statusFilter">
        <option value="all">전체 상태</option>
        <option value="draft">초안</option>
        <option value="sent">발송</option>
        <option value="approved">승인</option>
        <option value="rejected">거절</option>
      </select>
      <button type="button" id="toggleArchive">보관함 보기</button>
    </div>
    <div id="quoteList" class="quote-list"></div>
    <p id="emptyMsg" class="empty-msg" hidden>표시할 견적이 없어요.</p>
  </section>
</main>

<template id="quoteRowTemplate">
  <article class="quote-card">
    <div class="quote-main">
      <div class="quote-client"></div>
      <div class="quote-item"></div>
      <div class="quote-scope"></div>
      <div class="quote-money">
        <span class="quote-supply"></span>
        <span class="quote-vat"></span>
        <span class="quote-total"></span>
      </div>
    </div>
    <div class="quote-actions">
      <select class="statusSelect">
        <option value="draft">초안</option>
        <option value="sent">발송</option>
        <option value="approved">승인</option>
        <option value="rejected">거절</option>
      </select>
      <button type="button" class="archiveBtn">보관</button>
      <button type="button" class="restoreBtn">복원</button>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
